trigger:
  branches:
    include:
      - main

pool:
  name: 'Azure Pipelines'
  vmImage: 'ubuntu-latest'

variables:
  # Replace with the exact storage account name created in your 'Testing' resource group
  AZURE_STORAGE_ACCOUNT: 'YOUR_STORAGE_ACCOUNT_NAME'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install npm dependencies'

  - script: |
      npx playwright install --with-deps
    displayName: 'Install Playwright Browsers'

  - script: |
      npx playwright test
    displayName: 'Run Playwright Tests'
    continueOnError: true

  # 1. Generate local static HTML Allure report
  - script: |
      npx allure generate allure-results --clean -o allure-report
    displayName: 'Generate Static Allure HTML'

  # 2. Sync Allure HTML files to Azure Storage $web container
  - task: AzureCLI@2
    displayName: 'Deploy Report to Live URL'
    inputs:
      azureSubscription: 'azure-storage-connection'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az storage blob upload-batch \
          --account-name $(AZURE_STORAGE_ACCOUNT) \
          --source allure-report \
          --destination '$web' \
          --overwrite true
