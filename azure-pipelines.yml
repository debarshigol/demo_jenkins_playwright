trigger:
  branches:
    include:
      - main

pool:
  name: 'Azure Pipelines'
  vmImage: 'ubuntu-latest'

variables:
  AZURE_STORAGE_ACCOUNT: 'debarshigol'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install npm dependencies'

  - script: |
      npx playwright install --with-deps
    displayName: 'Install Playwright Browsers'

  - script: |
      npx playwright test
    displayName: 'Run Playwright Tests'
    continueOnError: true

  # 1. Generate local static Allure HTML report using Allure 3.x syntax
  - script: |
      npx allure generate -o allure-report allure-results
    displayName: 'Generate Static Allure HTML'

  # 2. Upload generated report files to Azure Blob Storage $web container
  - task: AzureCLI@2
    displayName: 'Deploy Report to Live URL'
    inputs:
      azureSubscription: 'azure-storage-connection'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        az storage blob upload-batch \
          --account-name $(AZURE_STORAGE_ACCOUNT) \
          --auth-mode login \
          --source allure-report \
          --destination '$web' \
          --overwrite true
